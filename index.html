<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engenho Colonial - Simulador</title>
    <style>
        body {
            background-color: #1a1c23;
            color: #f0e6d2;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            user-select: none;
        }
        #game-container {
            border: 4px solid #8b5a2b;
            background-color: #2a2219;
            padding: 20px;
            border-radius: 8px;
            width: 500px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .status-box {
            background: #3d3023;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
            text-align: left;
        }
        button {
            background-color: #8b5a2b;
            color: #fff;
            border: none;
            padding: 12px 15px;
            margin: 5px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s, transform 0.1s;
            touch-action: manipulation;
        }
        button:active {
            transform: scale(0.96);
            background-color: #704720;
        }
        button:hover {
            background-color: #a66e38;
        }
        button:disabled {
            background-color: #4a3e35;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }
        .upgrade-btn {
            display: block;
            width: 100%;
            text-align: left;
            margin: 8px 0;
            padding: 10px;
        }
        .log {
            font-size: 11px;
            color: #d4a373;
            margin-top: 10px;
            height: 30px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h2>🏭 Engenho Colonial Tycoon 🌾</h2>
        
        <div class="status-box">
            <p>🌾 <strong>Cana Colhida:</strong> <span id="cana">0</span> kg</p>
            <p>📦 <strong>Sacas de Açúcar:</strong> <span id="acucar">0</span></p>
            <p>💰 <strong>Moedas de Ouro:</strong> <span id="moedas">0</span></p>
        </div>

        <div>
            <button 
                onmousedown="iniciarAcao(colherCana)" 
                onmouseup="pararAcao()" 
                onmouseleave="pararAcao()"
                ontouchstart="iniciarAcao(colherCana)" 
                ontouchend="pararAcao()">
                1. Colher Cana
            </button>

            <button 
                onmousedown="iniciarAcao(moerAcucar)" 
                onmouseup="pararAcao()" 
                onmouseleave="pararAcao()"
                ontouchstart="iniciarAcao(moerAcucar)" 
                ontouchend="pararAcao()">
                2. Moer e Ferver (-10kg -> +1 Açúcar)
            </button>

            <button 
                onmousedown="iniciarAcao(venderAcucar)" 
                onmouseup="pararAcao()" 
                onmouseleave="pararAcao()"
                ontouchstart="iniciarAcao(venderAcucar)" 
                ontouchend="pararAcao()">
                3. Vender Açúcar (+15 Ouro/saca)
            </button>
        </div>

        <hr style="border-color: #8b5a2b; margin: 15px 0;">

        <div>
            <h3>Melhorias do Engenho (Máx: Nv. 5000)</h3>
            <button class="upgrade-btn" id="btn-moenda" onclick="comprarMoenda()">
                ⚙️ Roda de Água (Auto-click): Nv. <span id="nv-moenda">0</span>/5000<br>
                <small>Velocidade & Qtd: +0.5%/nv | Custo: <span id="custo-moenda">50</span> Ouro</small>
            </button>
            <button class="upgrade-btn" id="btn-carro" onclick="comprarCarro()">
                🐂 Carro de Bois (Transporte): Nv. <span id="nv-carro">0</span>/5000<br>
                <small>Qtd Colhida: +0.5%/nv | Custo: <span id="custo-carro">30</span> Ouro</small>
            </button>
        </div>

        <div class="log" id="mensagem">Mantenha os botões pressionados para repetir as ações!</div>
    </div>

    <script>
        let cana = 0;
        let acucar = 0;
        let moedas = 0;

        let nivelMoenda = 0;
        let nivelCarro = 0;
        const MAX_NIVEL = 5000;

        let intervaloAcao = null;
        let timerAutoClick = null;

        // Custos com progressão contínua
        function calcularCustoMoenda() {
            return Math.floor(50 * Math.pow(1.008, nivelMoenda));
        }

        function calcularCustoCarro() {
            return Math.floor(30 * Math.pow(1.008, nivelCarro));
        }

        // Cálculo da quantidade transportada (+0,5% por nível do Carro de Bois)
        function obterQtdCanaPorClique() {
            let bonus = 1 + (nivelCarro * 0.005);
            return Number((5 * bonus).toFixed(1));
        }

        // Aumento de quantidade e velocidade na produção automática
        function obterQtdAutoCana() {
            let bonus = 1 + (nivelMoenda * 0.005);
            return Number((2 * bonus).toFixed(1));
        }

        function atualizarInterface() {
            document.getElementById('cana').innerText = cana.toLocaleString('pt-PT');
            document.getElementById('acucar').innerText = acucar.toLocaleString('pt-PT');
            document.getElementById('moedas').innerText = moedas.toLocaleString('pt-PT');

            document.getElementById('nv-moenda').innerText = nivelMoenda;
            document.getElementById('custo-moenda').innerText = nivelMoenda < MAX_NIVEL ? calcularCustoMoenda().toLocaleString('pt-PT') : 'MÁX';
            document.getElementById('btn-moenda').disabled = nivelMoenda >= MAX_NIVEL || moedas < calcularCustoMoenda();

            document.getElementById('nv-carro').innerText = nivelCarro;
            document.getElementById('custo-carro').innerText = nivelCarro < MAX_NIVEL ? calcularCustoCarro().toLocaleString('pt-PT') : 'MÁX';
            document.getElementById('btn-carro').disabled = nivelCarro >= MAX_NIVEL || moedas < calcularCustoCarro();
        }

        function log(texto) {
            document.getElementById('mensagem').innerText = texto;
        }

        function iniciarAcao(acao) {
            acao();
            pararAcao();
            intervaloAcao = setInterval(acao, 150);
        }

        function pararAcao() {
            if (intervaloAcao !== null) {
                clearInterval(intervaloAcao);
                intervaloAcao = null;
            }
        }

        function colherCana() {
            let ganho = obterQtdCanaPorClique();
            cana = Number((cana + ganho).toFixed(1));
            log(`Colheu ${ganho}kg de cana-de-açúcar.`);
            atualizarInterface();
        }

        function moerAcucar() {
            if (cana >= 10) {
                cana = Number((cana - 10).toFixed(1));
                acucar += 1;
                log("Cana moída e fervida nas caldeiras! +1 saca de açúcar.");
                atualizarInterface();
            } else {
                log("Cana insuficiente! Precisa de pelo menos 10kg.");
            }
        }

        function venderAcucar() {
            if (acucar >= 1) {
                let ganho = acucar * 15;
                moedas += ganho;
                log(`Vendeu ${acucar} sacas de açúcar por ${ganho} moedas de ouro!`);
                acucar = 0;
                atualizarInterface();
            } else {
                log("Não tem sacas de açúcar para vender.");
            }
        }

        function comprarMoenda() {
            let custo = calcularCustoMoenda();
            if (moedas >= custo && nivelMoenda < MAX_NIVEL) {
                moedas -= custo;
                nivelMoenda++;
                log(`Roda de Água Nv. ${nivelMoenda}! Velocidade e quantidade +0.5%.`);
                reiniciarAutoClick();
                atualizarInterface();
            }
        }

        function comprarCarro() {
            let custo = calcularCustoCarro();
            if (moedas >= custo && nivelCarro < MAX_NIVEL) {
                moedas -= custo;
                nivelCarro++;
                log(`Carro de Bois Nv. ${nivelCarro}! Capacidade de transporte +0.5%.`);
                atualizarInterface();
            }
        }

        // Atualização da velocidade do auto-click (+0,5% de velocidade por nível)
        function reiniciarAutoClick() {
            if (timerAutoClick !== null) {
                clearInterval(timerAutoClick);
                timerAutoClick = null;
            }

            if (nivelMoenda > 0) {
                // A frequência aumenta 0,5% por nível -> o intervalo em ms reduz proporcionalmente
                let fatorVelocidade = 1 + (nivelMoenda * 0.005);
                let intervaloMs = Math.max(20, Math.floor(1000 / fatorVelocidade));

                timerAutoClick = setInterval(() => {
                    let ganhoAuto = obterQtdAutoCana();
                    cana = Number((cana + ganhoAuto).toFixed(1));
                    atualizarInterface();
                }, intervaloMs);
            }
        }

        atualizarInterface();
    </script>
</body>
</html>
