<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Mundo do Engenho Colonial</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #12100e;
            color: #f0e6d2;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }
        #ui-bar {
            width: 800px;
            background: #2a2016;
            border: 3px solid #8b5a2b;
            border-bottom: none;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 14px;
        }
        #canvas-container {
            position: relative;
            width: 800px;
            height: 500px;
            border: 4px solid #8b5a2b;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        canvas {
            background-color: #5c8332;
            display: block;
        }
        .modal {
            display: none;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            max-height: 440px;
            background: rgba(35, 26, 18, 0.96);
            border: 3px solid #d4a373;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 20px #000;
            overflow-y: auto;
            z-index: 10;
        }
        .modal h2 { color: #f4a261; margin-bottom: 10px; border-bottom: 2px solid #8b5a2b; padding-bottom: 5px; }
        .modal p { font-size: 13px; line-height: 1.5; margin-bottom: 12px; color: #e0d0b8; }
        .modal button {
            background: #8b5a2b;
            color: #fff;
            border: none;
            padding: 8px 12px;
            margin: 4px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
        }
        .modal button:hover { background: #a66e38; }
        .close-btn {
            background: #9a031e !important;
            float: right;
        }
        #controls-hint {
            margin-top: 10px;
            font-size: 12px;
            color: #a89f91;
            text-align: center;
        }
        .mobile-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .dpad-btn {
            width: 45px;
            height: 45px;
            background: #3d3023;
            border: 2px solid #8b5a2b;
            color: #fff;
            font-weight: bold;
            border-radius: 6px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div id="ui-bar">
        <span>📜 <span id="titulo-player">Senhor do Engenho</span></span>
        <span>💰 Ouro: <span id="res-ouro">150</span></span>
        <span>🌾 Cana: <span id="res-cana">0</span> kg</span>
        <span>📦 Açúcar: <span id="res-acucar">0</span></span>
        <span>👥 Pessoas: <span id="res-membros">6</span></span>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <!-- Modal das Estruturas -->
        <div id="buildingModal" class="modal">
            <button class="close-btn" onclick="fecharModal()">[X] Sair</button>
            <h2 id="modalTitle">Nome da Estrutura</h2>
            <div id="modalContent">Conteúdo explicativo e opções...</div>
        </div>
    </div>

    <div id="controls-hint">
        🎮 Use <strong>W, A, S, D</strong> para andar e <strong>E</strong> para interagir com os edifícios.
    </div>

    <div class="mobile-controls">
        <button class="dpad-btn" onclick="moverMobile(0, -15)">▲</button>
        <button class="dpad-btn" onclick="moverMobile(-15, 0)">◄</button>
        <button class="dpad-btn" onclick="moverMobile(0, 15)">▼</button>
        <button class="dpad-btn" onclick="moverMobile(15, 0)">►</button>
        <button class="dpad-btn" style="width:70px; background:#8b5a2b;" onclick="interagirPerto()">[E]</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Recursos e Estado
        let ouro = 150;
        let cana = 0;
        let acucar = 0;
        let escravizados = 5;
        let trabalhadoresLivres = 1;
        let tituloAtual = "Senhor do Engenho";

        // Jogador
        const player = {
            x: 400,
            y: 400,
            width: 24,
            height: 24,
            speed: 3.5,
            color: '#e76f51'
        };

        // Instalações
        const estruturas = [
            { id: 'casa_grande', nome: 'Casa-Grande & Gabinete', x: 340, y: 30, w: 120, h: 80, cor: '#f4a261' },
            { id: 'canavial', nome: 'Canavial (Plantação)', x: 40, y: 300, w: 140, h: 140, cor: '#2a9d8f' },
            { id: 'moenda', nome: 'Moenda (Roda d\'Água)', x: 260, y: 200, w: 120, h: 90, cor: '#e9c46a' },
            { id: 'caldeiras', nome: 'Casa das Caldeiras & Fornalhas', x: 420, y: 200, w: 130, h: 90, cor: '#d62828' },
            { id: 'purgar', nome: 'Casa de Purgar', x: 600, y: 200, w: 110, h: 90, cor: '#e0b1cb' },
            { id: 'senzala', nome: 'Senzala & Alojamentos', x: 620, y: 40, w: 100, h: 70, cor: '#6b705c' }
        ];

        const trabalhadoresVisiveis = [
            { x: 90, y: 350 }, { x: 120, y: 380 },
            { x: 300, y: 240 }, { x: 470, y: 240 }, { x: 640, y: 240 }
        ];

        const keys = {};
        let estruturaProxima = null;

        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() === 'e') interagirPerto();
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function atualizarRecursosUI() {
            document.getElementById('res-ouro').innerText = Math.floor(ouro);
            document.getElementById('res-cana').innerText = Math.floor(cana);
            document.getElementById('res-acucar').innerText = Math.floor(acucar);
            document.getElementById('res-membros').innerText = escravizados + trabalhadoresLivres;
            document.getElementById('titulo-player').innerText = tituloAtual;
        }

        function moverMobile(dx, dy) {
            player.x = Math.max(10, Math.min(canvas.width - player.width - 10, player.x + dx));
            player.y = Math.max(10, Math.min(canvas.height - player.height - 10, player.y + dy));
        }

        function interagirPerto() {
            if (estruturaProxima) abrirEstrutura(estruturaProxima);
        }

        function abrirEstrutura(est) {
            const modal = document.getElementById('buildingModal');
            const title = document.getElementById('modalTitle');
            const content = document.getElementById('modalContent');

            title.innerText = est.nome;
            modal.style.display = 'block';

            if (est.id === 'canavial') {
                content.innerHTML = `
                    <p><strong>📜 Contexto Histórico:</strong> A lavoura da cana-de-açúcar exigia solo fértil (como o massapê) e clima tropical. O trabalho no canavial envolve o corte manual sob o sol forte.</p>
                    <p>⚡ <strong>Produção Automática:</strong> O canavial colhe cana continuamente com base na quantidade de trabalhadores.</p>
                    <button onclick="colherCanaManual()">🌾 Acelerar Colheita (+50 kg)</button>
                `;
            } else if (est.id === 'moenda') {
                content.innerHTML = `
                    <p><strong>📜 Contexto Histórico:</strong> Na moenda, a cana é espremida entre cilindros para extração da garapa.</p>
                    <button onclick="moerCanaManual()">⚙️ Moer Cana (-50 kg Cana -> +10 Açúcar)</button>
                `;
            } else if (est.id === 'caldeiras') {
                content.innerHTML = `
                    <p><strong>📜 Contexto Histórico:</strong> O caldo extraído é fervido e escumado nos tachos de cobre para concentrar o melaço.</p>
                    <button onclick="ferverCaldoManual()">🔥 Ferver Melaço (-20 kg Cana -> +5 Açúcar)</button>
                `;
            } else if (est.id === 'purgar') {
                content.innerHTML = `
                    <p><strong>📜 Contexto Histórico:</strong> O açúcar cristaliza nas fôrmas cônicas de barro (pães de açúcar) para purificação.</p>
                    <button onclick="venderAcucarProce()">💰 Vender Açúcar (+15 Ouro/saca)</button>
                `;
            } else if (est.id === 'casa_grande') {
                content.innerHTML = `
                    <p><strong>🏛️ Gabinete do Senhor do Engenho:</strong> Gerencie títulos de nobreza e contrate mão de obra para acelerar o auto click.</p>
                    <hr style="border-color:#8b5a2b; margin:10px 0;">
                    <h3>Personalizar Título de Nobreza</h3>
                    <button onclick="mudarTitulo('Senhor do Engenho')">Senhor do Engenho</button>
                    <button onclick="mudarTitulo('Barão de Olinda')">Barão de Olinda (200 Ouro)</button>
                    <button onclick="mudarTitulo('Visconde do Açúcar')">Visconde do Açúcar (500 Ouro)</button>
                    <hr style="border-color:#8b5a2b; margin:10px 0;">
                    <h3>Gestão de Mão de Obra</h3>
                    <button onclick="adquirirTrabalhador('escravizado')">Adquirir Mão de Obra Escravizada (60 Ouro)</button>
                    <button onclick="adquirirTrabalhador('livre')">Contratar Mestre do Açúcar (100 Ouro)</button>
                `;
            } else if (est.id === 'senzala') {
                content.innerHTML = `
                    <p><strong>📜 Contexto Histórico:</strong> Local de alojamento da população escravizada que mantinha a força produtiva colonial.</p>
                    <p>Trabalhadores no engenho: <strong>${escravizados}</strong></p>
                `;
            }
        }

        function fecharModal() {
            document.getElementById('buildingModal').style.display = 'none';
        }

        function mudarTitulo(novoTitulo) {
            if (novoTitulo.includes('Barão') && ouro >= 200) { ouro -= 200; tituloAtual = novoTitulo; }
            else if (novoTitulo.includes('Visconde') && ouro >= 500) { ouro -= 500; tituloAtual = novoTitulo; }
            else if (novoTitulo === 'Senhor do Engenho') { tituloAtual = novoTitulo; }
            atualizarRecursosUI();
            abrirEstrutura(estruturas.find(e => e.id === 'casa_grande'));
        }

        function adquirirTrabalhador(tipo) {
            if (tipo === 'escravizado' && ouro >= 60) {
                ouro -= 60;
                escravizados++;
                trabalhadoresVisiveis.push({ x: 60 + Math.random()*80, y: 320 + Math.random()*80 });
            } else if (tipo === 'livre' && ouro >= 100) {
                ouro -= 100;
                trabalhadoresLivres++;
            }
            atualizarRecursosUI();
            abrirEstrutura(estruturas.find(e => e.id === 'casa_grande'));
        }

        // Ações manuais rápidas sem caixa de diálogo/alert
        function colherCanaManual() {
            cana += 50;
            atualizarRecursosUI();
        }

        function moerCanaManual() {
            if (cana >= 50) {
                cana -= 50;
                acucar += 10;
                atualizarRecursosUI();
            }
        }

        function ferverCaldoManual() {
            if (cana >= 20) {
                cana -= 20;
                acucar += 5;
                atualizarRecursosUI();
            }
        }

        function venderAcucarProce() {
            if (acucar >= 1) {
                ouro += acucar * 15;
                acucar = 0;
                atualizarRecursosUI();
            }
        }

        function update() {
            let speed = player.speed;
            if (keys['w'] || keys['arrowup']) player.y = Math.max(10, player.y - speed);
            if (keys['s'] || keys['arrowdown']) player.y = Math.min(canvas.height - player.height - 10, player.y + speed);
            if (keys['a'] || keys['arrowleft']) player.x = Math.max(10, player.x - speed);
            if (keys['d'] || keys['arrowright']) player.x = Math.min(canvas.width - player.width - 10, player.x + speed);

            estruturaProxima = null;
            estruturas.forEach(est => {
                if (
                    player.x < est.x + est.w + 15 &&
                    player.x + player.width > est.x - 15 &&
                    player.y < est.y + est.h + 15 &&
                    player.y + player.height > est.y - 15
                ) {
                    estruturaProxima = est;
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Caminhos
            ctx.fillStyle = '#b5835a';
            ctx.fillRect(0, 140, 800, 30);
            ctx.fillRect(380, 0, 40, 500);

            // Rio
            ctx.fillStyle = '#219ebc';
            ctx.fillRect(200, 180, 30, 320);

            // Estruturas
            estruturas.forEach(est => {
                ctx.fillStyle = est.cor;
                ctx.fillRect(est.x, est.y, est.w, est.h);
                ctx.strokeStyle = '#2b1e10';
                ctx.lineWidth = 3;
                ctx.strokeRect(est.x, est.y, est.w, est.h);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px sans-serif';
                ctx.fillText(est.nome, est.x + 5, est.y + 20);
            });

            // Trabalhadores
            trabalhadoresVisiveis.forEach(t => {
                ctx.fillStyle = '#8d5b4c';
                ctx.fillRect(t.x, t.y, 10, 10);
            });

            // Jogador
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.strokeRect(player.x, player.y, player.width, player.height);

            if (estruturaProxima) {
                ctx.fillStyle = '#ffe66d';
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText(`Pressione [E] para entrar em: ${estruturaProxima.nome}`, 220, 480);
            }
        }

        // SISTEMA DE AUTO CLICK CORRIGIDO E FLUIDO
        // Executa continuamente em background acelerando conforme os trabalhadores
        setInterval(() => {
            // 1. Produção contínua de cana
            let taxaCana = (escravizados * 1.5) + (trabalhadoresLivres * 4.0);
            cana += taxaCana;

            // 2. Auto-moagem e produção contínua de açúcar
            let taxaConversao = Math.min(cana, trabalhadoresLivres * 3 + escravizados * 0.5);
            if (taxaConversao > 0) {
                cana -= taxaConversao;
                acucar += taxaConversao * 0.3;
            }

            atualizarRecursosUI();
        }, 300); // Roda a cada 300 milissegundos

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        atualizarRecursosUI();
        gameLoop();
    </script>
</body>
</html>
