<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engenho Colonial - Hyper Clicker</title>
    <style>
        body {
            background-color: #1a1c23;
            color: #f0e6d2;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            user-select: none;
        }
        #game-container {
            border: 4px solid #8b5a2b;
            background-color: #2a2219;
            padding: 20px;
            border-radius: 8px;
            width: 520px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .status-box {
            background: #3d3023;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
            text-align: left;
        }
        button {
            background-color: #8b5a2b;
            color: #fff;
            border: none;
            padding: 12px 15px;
            margin: 5px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s, transform 0.1s;
            touch-action: manipulation;
        }
        button:active {
            transform: scale(0.96);
            background-color: #704720;
        }
        button:hover {
            background-color: #a66e38;
        }
        button:disabled {
            background-color: #4a3e35;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }
        .upgrade-btn {
            display: block;
            width: 100%;
            text-align: left;
            margin: 8px 0;
            padding: 10px;
        }
        .log {
            font-size: 11px;
            color: #d4a373;
            margin-top: 10px;
            height: 30px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h2>⚡ Engenho Colonial Hyper 🌾</h2>
        
        <div class="status-box">
            <p>🌾 <strong>Cana Colhida:</strong> <span id="cana">0</span> kg</p>
            <p>📦 <strong>Sacas de Açúcar:</strong> <span id="acucar">0</span></p>
            <p>💰 <strong>Moedas de Ouro:</strong> <span id="moedas">0</span></p>
        </div>

        <div>
            <button 
                onmousedown="iniciarAcao(colherCana)" 
                onmouseup="pararAcao()" 
                onmouseleave="pararAcao()"
                ontouchstart="iniciarAcao(colherCana)" 
                ontouchend="pararAcao()">
                1. Colher Cana
            </button>

            <button 
                onmousedown="iniciarAcao(moerAcucar)" 
                onmouseup="pararAcao()" 
                onmouseleave="pararAcao()"
                ontouchstart="iniciarAcao(moerAcucar)" 
                ontouchend="pararAcao()">
                2. Moer e Ferver em Massa
            </button>

            <button 
                onmousedown="iniciarAcao(venderAcucar)" 
                onmouseup="pararAcao()" 
                onmouseleave="pararAcao()"
                ontouchstart="iniciarAcao(venderAcucar)" 
                ontouchend="pararAcao()">
                3. Vender Todo o Açúcar
            </button>
        </div>

        <hr style="border-color: #8b5a2b; margin: 15px 0;">

        <div>
            <h3>Melhorias Quânticas (Máx: Nv. 5000)</h3>
            <button class="upgrade-btn" id="btn-moenda" onclick="comprarMoenda()">
                ⚙️ Roda de Água (Auto-Click Ultra): Nv. <span id="nv-moenda">0</span>/5000<br>
                <small>Velocidade & Produção Multiplicadas | Custo: <span id="custo-moenda">50</span> Ouro</small>
            </button>
            <button class="upgrade-btn" id="btn-carro" onclick="comprarCarro()">
                🐂 Carro de Bois (Transporte Massivo): Nv. <span id="nv-carro">0</span>/5000<br>
                <small>Multiplicador Colossal por Clique | Custo: <span id="custo-carro">30</span> Ouro</small>
            </button>
        </div>

        <div class="log" id="mensagem">Modo de ultra-velocidade ativado!</div>
    </div>

    <script>
        let cana = 0;
        let acucar = 0;
        let moedas = 0;

        let nivelMoenda = 0;
        let nivelCarro = 0;
        const MAX_NIVEL = 5000;

        let intervaloAcao = null;

        // Formata números gigantes em Notação Científica se necessário
        function formatarNumero(num) {
            if (num >= 1e9) {
                return num.toExponential(4);
            }
            return num.toLocaleString('pt-PT', { maximumFractionDigits: 1 });
        }

        function calcularCustoMoenda() {
            return Math.floor(50 * Math.pow(1.06, nivelMoenda));
        }

        function calcularCustoCarro() {
            return Math.floor(30 * Math.pow(1.06, nivelCarro));
        }

        // Quantidade por clique cresce exponencialmente com os níveis
        function obterQtdCanaPorClique() {
            let multiplicador = Math.pow(1.10, nivelCarro);
            return 5 * multiplicador;
        }

        // Produção automática por ciclo
        function obterQtdAutoCana() {
            let multiplicador = Math.pow(1.12, nivelMoenda);
            return 2 * multiplicador;
        }

        function atualizarInterface() {
            document.getElementById('cana').innerText = formatarNumero(cana);
            document.getElementById('acucar').innerText = formatarNumero(acucar);
            document.getElementById('moedas').innerText = formatarNumero(moedas);

            document.getElementById('nv-moenda').innerText = nivelMoenda;
            document.getElementById('custo-moenda').innerText = nivelMoenda < MAX_NIVEL ? formatarNumero(calcularCustoMoenda()) : 'MÁX';
            document.getElementById('btn-moenda').disabled = nivelMoenda >= MAX_NIVEL || moedas < calcularCustoMoenda();

            document.getElementById('nv-carro').innerText = nivelCarro;
            document.getElementById('custo-carro').innerText = nivelCarro < MAX_NIVEL ? formatarNumero(calcularCustoCarro()) : 'MÁX';
            document.getElementById('btn-carro').disabled = nivelCarro >= MAX_NIVEL || moedas < calcularCustoCarro();
        }

        function log(texto) {
            document.getElementById('mensagem').innerText = texto;
        }

        function iniciarAcao(acao) {
            acao();
            pararAcao();
            // Executa a cada 10ms (velocidade máxima recomendada de clique contínuo no navegador)
            intervaloAcao = setInterval(acao, 10);
        }

        function pararAcao() {
            if (intervaloAcao !== null) {
                clearInterval(intervaloAcao);
                intervaloAcao = null;
            }
        }

        function colherCana() {
            let ganho = obterQtdCanaPorClique();
            cana += ganho;
            log(`Colheu +${formatarNumero(ganho)}kg de cana!`);
            atualizarInterface();
        }

        function moerAcucar() {
            let custoCana = 10;
            if (cana >= custoCana) {
                // Converte em grandes volumes proporcionalmente ao nível da moenda
                let conversoes = Math.min(Math.floor(cana / custoCana), Math.max(1, nivelMoenda * 50));
                cana -= custoCana * conversoes;
                acucar += conversoes;
                log(`Moído! +${formatarNumero(conversoes)} sacas de açúcar.`);
                atualizarInterface();
            } else {
                log("Cana insuficiente!");
            }
        }

        function venderAcucar() {
            if (acucar >= 1) {
                let ganho = acucar * 15;
                moedas += ganho;
                log(`Vendeu ${formatarNumero(acucar)} sacas por ${formatarNumero(ganho)} moedas de ouro!`);
                acucar = 0;
                atualizarInterface();
            } else {
                log("Sem açúcar para vender.");
            }
        }

        function comprarMoenda() {
            let custo = calcularCustoMoenda();
            if (moedas >= custo && nivelMoenda < MAX_NIVEL) {
                moedas -= custo;
                nivelMoenda++;
                log(`Roda de Água Nv. ${nivelMoenda}! Frequência e quantidade multiplicadas!`);
                atualizarInterface();
            }
        }

        function comprarCarro() {
            let custo = calcularCustoCarro();
            if (moedas >= custo && nivelCarro < MAX_NIVEL) {
                moedas -= custo;
                nivelCarro++;
                log(`Carro de Bois Nv. ${nivelCarro}! Capacidade de transporte multiplicada!`);
                atualizarInterface();
            }
        }

        // Loop de Auto-Click em Frequência Quântica (Simula múltiplos sub-clicks virtuais a cada 16 milissegundos)
        setInterval(() => {
            if (nivelMoenda > 0) {
                // A cada nível da moenda, aumenta em centenas/milhares de cliques simultâneos por frame
                let subClicksPorTick = Math.max(1, Math.floor(nivelMoenda * 5));
                let ganhoPorCiclo = obterQtdAutoCana();
                
                cana += ganhoPorCiclo * subClicksPorTick;
                atualizarInterface();
            }
        }, 16); // 60 FPS
    </script>
</body>
</html>
