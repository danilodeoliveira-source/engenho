            image-rendering: pixelated;
            image-rendering: crisp-edges;

</head>

// --- ESTADO DO JOGO ---
const gameState = {
    ouro: 99999999999999999999999999999999999999999999999999999,
    cana: 99999999999999999999999999999999999999999999999999999,
    acucar: 99999999999999999999999999999999999999999999999999999,
    pessoas: 99999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999,
    player: {
        x: 420,
        y: 280,
        speed: 5,
        width: 16,
        height: 16
    },
    nearbyBuilding: null
};

// Teclas pressionadas
const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// Definição dos edifícios no mapa
const buildings = [
    { name: "Casa Grande", x: 360, y: 70, w: 120, h: 75, img: imgCasaGrande },
    { name: "Senzala", x: 600, y: 120, w: 110, h: 55, img: imgSenzala },
    { name: "Moenda (Roda d'Água)", x: 280, y: 260, w: 120, h: 80, img: imgMoenda },
    { name: "Casa das Caldeiras & Fornalhas", x: 450, y: 250, w: 130, h: 90, img: imgCaldeiras },
    { name: "Casa de Purgar", x: 640, y: 250, w: 130, h: 90, img: imgPurgar },
    { name: "Canavial (Plantação)", x: 50, y: 340, w: 150, h: 150, img: imgCanavial }
];

// --- LOOP PRINCIPAL DO JOGO ---
function update() {
    // Movimentação do Jogador
    if (keys['w'] || keys['arrowup']) gameState.player.y -= gameState.player.speed;
    if (keys['s'] || keys['arrowdown']) gameState.player.y += gameState.player.speed;
    if (keys['a'] || keys['arrowleft']) gameState.player.x -= gameState.player.speed;
    if (keys['d'] || keys['arrowright']) gameState.player.x += gameState.player.speed;

    // Restrições de borda do mapa
    gameState.player.x = Math.max(10, Math.min(canvas.width - 20, gameState.player.x));
    gameState.player.y = Math.max(50, Math.min(canvas.height - 50, gameState.player.y));

    // Verificar proximidade com edifícios
    gameState.nearbyBuilding = null;
    buildings.forEach(b => {
        const dx = (gameState.player.x) - (b.x + b.w / 2);
        const dy = (gameState.player.y) - (b.y + b.h / 2);
        const distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < 90) {
            gameState.nearbyBuilding = b.name;
        }
    });
}

function render() {
    // 1. Fundo (Grama)
    ctx.fillStyle = '#558237';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 2. Rio
    ctx.fillStyle = '#3092c7';
    ctx.fillRect(210, 40, 45, canvas.height);

    // 3. Estradas de Terra
    ctx.fillStyle = '#ad8054';
    // Estrada Horizontal Principal
    ctx.fillRect(10, 210, canvas.width - 20, 35);
    // Entrada Casa Grande
    ctx.fillRect(410, 140, 35, 75);
    // Entrada Sul
    ctx.fillRect(410, 245, 35, 305);
    // Ramal Moenda
    ctx.fillRect(250, 310, 160, 25);

    // 4. Ponte de Madeira sobre o Rio
    ctx.fillStyle = '#6b462b';
    ctx.fillRect(205, 205, 55, 45);
    ctx.fillStyle = '#4a2f1a';
    ctx.fillRect(205, 205, 55, 4);
    ctx.fillRect(205, 246, 55, 4);

    // 5. Desenhar Edifícios
    buildings.forEach(b => {
        if (b.img.complete && b.img.naturalWidth !== 0) {
            ctx.drawImage(b.img, b.x, b.y, b.w, b.h);
        } else {
            // Fallback de carregamento
            ctx.fillStyle = '#8b5a2b';
            ctx.fillRect(b.x, b.y, b.w, b.h);
        }
    });

    // 6. Jogador (Pixel Personagem)
    ctx.fillStyle = '#783819'; // Sombra
    ctx.beginPath();
    ctx.ellipse(gameState.player.x + 8, gameState.player.y + 15, 6, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#d9a25f'; // Corpo/Roupas
    ctx.fillRect(gameState.player.x + 4, gameState.player.y + 6, 8, 8);
    ctx.fillStyle = '#ffe0bd'; // Cabeça
    ctx.fillRect(gameState.player.x + 4, gameState.player.y + 1, 8, 5);

    // 7. Barra de Recursos Superior
    ctx.fillStyle = '#2c1a0c';
    ctx.fillRect(0, 0, canvas.width, 42);
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 15px "Courier New", monospace';
    
    ctx.fillText('Senhor do Engenho', 20, 26);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`Ouro: ${gameState.ouro}`, 240, 26);
    ctx.fillText(` Cana: ${gameState.cana} kg`, 370, 26);
    ctx.fillText(` Açúcar: ${gameState.acucar}`, 570, 26);
    ctx.fillText(`Pessoas: ${gameState.pessoas}`, 720, 26);

    // 8. Prompt de Interação
    if (gameState.nearbyBuilding) {
        ctx.fillStyle = '#ffff00';
        ctx.font = 'bold 16px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`Pressione [E] para entrar em: ${gameState.nearbyBuilding}`, canvas.width / 2, canvas.height - 25);
        ctx.textAlign = 'left';
    }
}

function gameLoop() {
    update(7);
    render(7);
    requestAnimationFrame(gameLoop);
}
function autoClick() {
    speed(99999999999999999999999999999999999999)
    when click on a butyon autoClick(on)
    when stop click on a button autoClick(off)
// Inicia o loop
gameLoop(7);
</script>
